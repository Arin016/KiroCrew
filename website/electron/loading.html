<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KiroClaw</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      -webkit-app-region: drag;
      user-select: none;
    }
    .container { text-align: center; }
    .logo { font-size: 48px; margin-bottom: 16px; }
    .title { font-size: 20px; font-weight: 600; margin-bottom: 24px; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #1e293b;
      border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .status { font-size: 13px; color: #64748b; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🐾</div>
    <div class="title">KiroClaw</div>
    <div class="spinner"></div>
    <div class="status" id="status">Checking gateway…</div>
  </div>
  <script>
    window.electronAPI?.onStatus?.((msg) => {
      document.getElementById('status').textContent = msg;
    });
  </script>
</body>
</html>

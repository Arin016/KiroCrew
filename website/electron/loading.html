<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>KiroClaw</title>
  <style>
    /*
      KiroClaw boot animation. Brand palette:
        Neon Purple  #8B5CF6   Midnight Black #0A0A0A
        Ghost White  #F5F5F5   Soft Lavender  #DDD6FE
      The ghost is recreated as inline SVG so each part (eyes, wrench, halo)
      animates independently and stays crisp at any DPI. Honors
      prefers-reduced-motion. The whole surface is a window drag region.
    */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple: #8B5CF6;
      --purple-deep: #6D28D9;
      --lavender: #DDD6FE;
      --ghost: #F5F5F5;
      --ink: #0A0A0A;
    }

    html, body { height: 100%; }
    body {
      background:
        radial-gradient(120% 120% at 50% 38%, #16131f 0%, #0c0a12 55%, #08070d 100%);
      color: var(--lavender);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
      user-select: none;
    }

    .stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      animation: stage-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes stage-in { from { opacity: 0; } to { opacity: 1; } }

    /* ── Ghost ── */
    .ghost-wrap {
      position: relative;
      width: 180px;
      height: 180px;
      display: grid;
      place-items: center;
    }

    /* Soft purple halo that breathes behind the ghost. */
    .halo {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.55) 0%, rgba(139, 92, 246, 0.18) 42%, transparent 68%);
      filter: blur(6px);
      animation: halo-breathe 3.2s ease-in-out infinite;
      will-change: transform, opacity;
    }
    @keyframes halo-breathe {
      0%, 100% { opacity: 0.55; transform: scale(0.92); }
      50%      { opacity: 1;    transform: scale(1.08); }
    }

    .ghost-svg {
      position: relative;
      width: 150px;
      height: 150px;
      overflow: visible;
      transform-origin: 50% 60%;
      /* float-in, then settle into a gentle infinite bob */
      animation:
        ghost-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) both,
        ghost-bob 3.6s ease-in-out 0.9s infinite;
      filter: drop-shadow(0 8px 22px rgba(139, 92, 246, 0.45));
      will-change: transform;
    }
    @keyframes ghost-in {
      0%   { opacity: 0; transform: translateY(34px) scale(0.82); }
      60%  { opacity: 1; }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes ghost-bob {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-9px) rotate(-1.2deg); }
    }

    /* Eyes blink occasionally (scaleY pinch). */
    .eyes {
      transform-origin: center 112px;
      animation: blink 5.4s ease-in-out 1.6s infinite;
    }
    @keyframes blink {
      0%, 92%, 100% { transform: scaleY(1); }
      95%           { transform: scaleY(0.12); }
    }

    /* Wrench-claw arm waves a couple of times after the ghost lands. */
    .wrench {
      transform-origin: 70px 150px;
      animation: wave 2.4s ease-in-out 1.0s 2;
    }
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25%      { transform: rotate(-18deg); }
      55%      { transform: rotate(8deg); }
      80%      { transform: rotate(-6deg); }
    }

    /* ── Wordmark ── */
    .wordmark {
      display: flex;
      gap: 1px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--ghost);
    }
    .wordmark span {
      display: inline-block;
      opacity: 0;
      transform: translateY(14px);
      animation: letter-in 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      text-shadow: 0 2px 18px rgba(139, 92, 246, 0.5);
    }
    /* "Claw" tinted purple to echo the two-tone wordmark in the brand art. */
    .wordmark .claw { color: var(--purple); }
    @keyframes letter-in {
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Status + progress ── */
    .footer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      animation: fade-up 0.6s ease 0.5s both;
    }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .track {
      width: 168px;
      height: 3px;
      border-radius: 99px;
      background: rgba(221, 214, 254, 0.14);
      overflow: hidden;
      position: relative;
    }
    .track::after {
      content: "";
      position: absolute;
      top: 0;
      left: -45%;
      width: 40%;
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--purple), var(--lavender), var(--purple), transparent);
      animation: sweep 1.5s ease-in-out infinite;
    }
    @keyframes sweep {
      0%   { left: -45%; }
      100% { left: 105%; }
    }
    .status {
      font-size: 13px;
      letter-spacing: 0.2px;
      color: rgba(221, 214, 254, 0.66);
      min-height: 16px;
    }

    @media (prefers-reduced-motion: reduce) {
      .stage, .ghost-svg, .halo, .eyes, .wrench, .wordmark span, .footer, .track::after {
        animation: none !important;
      }
      .ghost-svg, .footer { opacity: 1; transform: none; }
      .wordmark span { opacity: 1; transform: none; }
      .track::after { left: 0; width: 100%; opacity: 0.5; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ghost-wrap">
      <div class="halo"></div>
      <!-- Ghost recreated from the KiroClaw brand mark: white body, neon-purple
           outline, two eyes, open-end wrench-claw arm on the left. -->
      <svg class="ghost-svg" viewBox="0 0 220 220" fill="none" aria-label="KiroClaw">
        <!-- Wrench-claw arm (drawn first so the body edge overlaps its joint).
             Thin stalk off the mid-left body to an open-end wrench head — an
             almost-closed purple ring with a mouth facing out, echoing the
             brand mark (and the "Claw"). -->
        <g class="wrench">
          <!-- stalk from mid-left body out to the claw joint -->
          <path
            d="M66 132 Q 54 130 48 123"
            stroke="var(--purple)" stroke-width="8" stroke-linecap="round" fill="none"/>
          <!-- open-jaw "C" claw: a stroked circle with a dash gap forming the
               mouth, rotated so the opening faces up-left like the brand mark.
               circumference = 2*pi*12 ≈ 75.4; dash 56 + gap 19.4 ≈ 92° mouth. -->
          <circle
            cx="38" cy="110" r="12"
            stroke="var(--purple)" stroke-width="7" fill="none" stroke-linecap="round"
            stroke-dasharray="56 19.4" stroke-dashoffset="9"
            transform="rotate(-44 38 110)"/>
        </g>

        <!-- Ghost body: domed top, scalloped bottom -->
        <path
          d="M62 176
             C 52 120 58 50 110 48
             C 162 50 168 120 158 176
             C 156 188 146 188 142 178
             C 138 168 130 168 126 178
             C 122 188 112 188 108 178
             C 104 168 96 168 92 178
             C 88 188 78 188 74 178
             C 70 168 66 184 62 176 Z"
          fill="var(--ghost)" stroke="var(--purple)" stroke-width="9" stroke-linejoin="round"/>

        <!-- Eyes -->
        <g class="eyes" fill="var(--ink)">
          <ellipse cx="100" cy="112" rx="9.5" ry="14"/>
          <ellipse cx="134" cy="112" rx="9.5" ry="14"/>
        </g>
      </svg>
    </div>

    <div class="wordmark" id="wordmark" aria-hidden="true"></div>

    <div class="footer">
      <div class="track"></div>
      <div class="status" id="status">Starting KiroClaw…</div>
    </div>
  </div>

  <script>
    // Build the wordmark with per-letter stagger. "Claw" is tinted purple.
    (function () {
      const word = "KiroClaw";
      const clawStart = 4; // index where "Claw" begins
      const host = document.getElementById("wordmark");
      [...word].forEach((ch, i) => {
        const s = document.createElement("span");
        s.textContent = ch;
        if (i >= clawStart) s.className = "claw";
        s.style.animationDelay = (0.55 + i * 0.05) + "s";
        host.appendChild(s);
      });
    })();

    // Live boot status from main.js (same "status" IPC channel as before).
    window.electronAPI?.onStatus?.((msg) => {
      const el = document.getElementById("status");
      if (el && msg) el.textContent = msg;
    });
  </script>
</body>
</html>

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kiroclaw"
version = "0.1.0"
description = "Personal AI agent that runs locally — chat via CLI, dashboard, Slack, or desktop app"
readme = "README.md"
# macOS (x86_64 + arm64) and Linux (x86_64 + aarch64), CPython 3.9-3.13.
# Must be declared in this [project] table: when it exists, setuptools reads
# requires-python from here (not setup.cfg), and an absent value makes the
# build backend raise SpecifierSet(None) -> TypeError during wheel builds.
requires-python = ">=3.9"
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/YOUR_ORG/kiroclaw"

[project.scripts]
kiroclaw = "kiro_claw.cli:main"

[tool.black]
line-length = 100

[tool.isort]
known_first_party = ["kiro_claw"]

# required for compatibility with black:
profile = "black"

# To maintain consistency with other settings
line_length = 100

[tool.mypy]
mypy_path = "src"
# See https://mypy.readthedocs.io/en/latest/config_file.html for more mypy options.

# Enables the type-checker on the interior of functions without type annotations.
check_untyped_defs = true

# Displaying specific error codes makes it easier to silence specific errors
# See also https://mypy.readthedocs.io/en/latest/error_codes.html
show_error_codes = true

# Show source code snippets and location markers in error messages
pretty = true

# Suppresses errors about packages which do not implement type-hint sharing.
# See also https://mypy.readthedocs.io/en/latest/running_mypy.html#missing-imports.
ignore_missing_imports = true


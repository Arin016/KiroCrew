[options]
zip_safe = True
include_package_data = True
# macOS (x86_64 + arm64) and Linux (x86_64 + aarch64), CPython 3.9-3.13.
# Windows is not supported. Declaring this gives pip a clear, early error on
# an unsupported interpreter instead of a late syntax/dependency failure.
python_requires = >=3.9
package_dir =
    = src
packages = find:
install_requires =
    aiohttp>=3.9,<4
    slack-sdk>=3.27,<4
    websockets>=12,<16
    cron-descriptor>=1.4,<2
    croniter>=2.0,<3
    numpy>=1.21,<3
    snowballstemmer>=1.0
    # pysqlite3 needed on older Linux x86_64 (old SQLite lacks FTS5/UPSERT);
    # modern Linux, macOS, and aarch64 ship a recent SQLite. No aarch64 wheels exist.
    pysqlite3-binary>=0.5.4; sys_platform == "linux" and platform_machine == "x86_64"
    python-docx>=0.8.6,<2
    requests>=2.28,<3
    # Eagerly imported by kiro_claw.cc_agent (the default Claude Code provider
    # path: agent.py, mirror.py, acp/client.py, providers/cleanup.py,
    # config/loader.py) for agent frontmatter; also eval scenario specs and the
    # task planner.
    PyYAML>=6,<7

[options.extras_require]
# Optional speech-to-text / AWS integrations. Install with:
#   pip install kiroclaw[voice]
# amazon-transcribe (and its boto3 credential resolver in kiro_claw.transcribe)
# are only needed for the voice transcription feature; core kiroclaw runs
# without them.
voice =
    boto3>=1.34,<2
    amazon-transcribe>=0.6,<1
aws =
    boto3>=1.34,<2
# Build the standalone desktop backend binary:
#   pip install kiroclaw[desktop] && make backend-bin
desktop =
    pyinstaller>=6,<7

[options.packages.find]
where = src
exclude =
    test

[options.package_data]
kiro_claw =
    py.typed
    slack-manifest.yaml
    model_tokens.json
    model_registry.json
    config/defaults.json
    config/prompt.md
    config/persona-lumon.md
    config/persona-lcars.md
    config/prompt-orchestrator.md
    apps/app-registry.json
    apps/builtins/*/app.json
    eval/scenarios/*.json
    docs/*.md
    scripts/*.mjs
    static/*
    static/css/*
    static/js/*
    tests_fixtures/**/*
    _vendor/**/*

[options.entry_points]
# Console scripts installed onto PATH by pip:
#   kiroclaw        -> kiro_claw.cli:main
#   kiroclaw-browse -> kiro_claw.browser.cli:main
console_scripts =
    kiroclaw = kiro_claw.cli:main
    kiroclaw-browse = kiro_claw.browser.cli:main

# Configuration for pytest; enable coverage for KiroClaw, emit
# XML, HTML, and terminal reports.
[tool:pytest]
xfail_strict = true
markers =
    integration: live browser tests requiring Chrome CDP
pythonpath = src
addopts =
    --verbose
    --ignore=build/private
    # Parallel test execution via xdist. Override with -n0 for debugging:
    #   pytest -n0 -k test_name --pdb
    -n auto
    --dist worksteal
    --timeout=120
    --cov kiro_claw
    --cov-config setup.cfg
    --cov-report term-missing
    --cov-report html:build/coverage
    --cov-report xml:build/coverage/coverage.xml
    # show the slowest 5 tests at the end
    --durations=5
    # Default to colorful output
    --color=yes
    # Uncomment to enforce a minimum code coverage threshold.
    # --cov-fail-under 50
testpaths = test transfer
looponfailroots = src test

# Additional coverage.py settings. The parallel flag and source values let
# pytest-cov alias the installed-package absolute paths back to the relative
# ones in your package source.
[coverage:run]
branch = true
parallel = true

[coverage:paths]
source =
    src/
    build/lib/*/site-packages/

[coverage:html]
directory = build/coverage

[coverage:xml]
output = build/coverage/coverage.xml

[flake8]
ignore =
    # Not pep8, black adds whitespace before ':'
    E203,
    # Not pep8, black adds line break before binary operator
    W503,
    # After auto-formatting, the only remaining long lines do not matter; ignore.
    E501,
max_line_length = 100
per-file-ignores =
    # _ensure_ssl_certs() must run before any library caches its SSL context
    src/kiro_claw/cli.py: E402
    src/kiro_claw/__main__.py: E402
    # Builtin app backends use compact continuation indent style
    src/kiro_claw/apps/builtins/*: E128
# Uncomment to enforce a maximum cyclomatic complexity - more info https://en.wikipedia.org/wiki/Cyclomatic_complexity
# max_complexity=10

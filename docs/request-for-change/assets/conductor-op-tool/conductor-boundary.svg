<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="700" viewBox="0 0 1140 700" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <rect width="1140" height="700" fill="#16151c"/>

  <text x="40" y="40" fill="#ececf1" font-size="20" font-weight="700">Conductor：谁拥有什么 · 以及决定性的那条进程边界</text>

  <!-- Conductor box -->
  <rect x="390" y="64" width="360" height="62" rx="10" fill="#2a2440" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="570" y="90" fill="#ddd6fe" font-size="15" font-weight="700" text-anchor="middle">Conductor 模型</text>
  <text x="570" y="111" fill="#9b98a8" font-size="12" text-anchor="middle">唯一的执行者：读 skill · 调工具 · 跑 script</text>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#6b6878"/>
    </marker>
  </defs>
  <path d="M470,126 L205,196" stroke="#6b6878" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M570,126 L570,196" stroke="#6b6878" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <path d="M670,126 L935,196" stroke="#6b6878" stroke-width="1.4" fill="none" marker-end="url(#a)"/>
  <text x="300" y="152" fill="#6b6878" font-size="11.5">读</text>
  <text x="580" y="166" fill="#6b6878" font-size="11.5">execute_bash</text>
  <text x="800" y="152" fill="#6b6878" font-size="11.5">MCP 调用</text>

  <!-- Column 1: SKILL -->
  <rect x="40" y="200" width="330" height="196" rx="10" fill="#1e1d26" stroke="#35333f" stroke-width="1.2"/>
  <text x="60" y="228" fill="#ececf1" font-size="15" font-weight="700">SKILL.md</text>
  <text x="60" y="248" fill="#9b98a8" font-size="11.5">不执行任何东西 · 纯文本</text>
  <text x="60" y="277" fill="#c4b5fd" font-size="13" font-weight="700">拥有：顺序与词汇</text>
  <text x="60" y="301" fill="#d6d4de" font-size="12.5">· op 词汇表</text>
  <text x="60" y="322" fill="#d6d4de" font-size="12.5">· 每个 op 的参数</text>
  <text x="60" y="343" fill="#d6d4de" font-size="12.5">· create → send → ledger 次序</text>
  <text x="60" y="364" fill="#d6d4de" font-size="12.5">· 停止条件 / 巡检节奏</text>

  <!-- Column 2: script -->
  <rect x="395" y="200" width="330" height="196" rx="10" fill="#1e1d26" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="415" y="228" fill="#ececf1" font-size="15" font-weight="700">bundled script</text>
  <text x="415" y="248" fill="#fbbf24" font-size="11.5">agent 的子进程</text>
  <text x="415" y="277" fill="#c4b5fd" font-size="13" font-weight="700">拥有：判定与格式</text>
  <text x="415" y="301" fill="#d6d4de" font-size="12.5">· accept_eval.py（收敛判定）</text>
  <text x="415" y="322" fill="#d6d4de" font-size="12.5">· ledger_entry.py（条目格式）</text>
  <text x="415" y="343" fill="#d6d4de" font-size="12.5">· queue.py（待建 · 原子队列）</text>
  <rect x="415" y="355" width="290" height="28" rx="6" fill="#3a2e12"/>
  <text x="427" y="374" fill="#fcd34d" font-size="11.5">✗ 无身份 → 只能做不需要身份的事</text>

  <!-- Column 3: session_ctl -->
  <rect x="750" y="200" width="330" height="196" rx="10" fill="#1e1d26" stroke="#4ade80" stroke-width="1.2"/>
  <text x="770" y="228" fill="#ececf1" font-size="15" font-weight="700">session_ctl（1 个 stub）</text>
  <text x="770" y="248" fill="#4ade80" font-size="11.5">MCP server 进程</text>
  <text x="770" y="277" fill="#c4b5fd" font-size="13" font-weight="700">拥有：身份与授权</text>
  <text x="770" y="301" fill="#d6d4de" font-size="12.5" font-family="monospace">op = create | send | read | stop</text>
  <text x="770" y="321" fill="#d6d4de" font-size="12.5" font-family="monospace">   | folder_create | folder_move</text>
  <rect x="770" y="334" width="290" height="49" rx="6" fill="#13301d"/>
  <text x="782" y="352" fill="#86efac" font-size="11.5">✓ gateway 注入 caller context / env</text>
  <text x="782" y="371" fill="#86efac" font-size="11.5">✓ HOST_PID + 签名 sidecar</text>

  <!-- boundary band -->
  <rect x="40" y="418" width="1040" height="86" rx="10" fill="#201f2a" stroke="#57545f" stroke-width="1.3" stroke-dasharray="7 5"/>
  <text x="60" y="446" fill="#f0abfc" font-size="14" font-weight="700">决定性的是进程边界，不是 server 归属。</text>
  <text x="60" y="471" fill="#d6d4de" font-size="12.5">三个被认可的身份源全部由 gateway 注入到 MCP server 进程；execute_bash 的子进程里拿不到（已实测）。</text>
  <text x="60" y="492" fill="#d6d4de" font-size="12.5">所以 script 无论怎么写，都只能自断言身份 —— 这正是「把 session 操作搬进 script」接不上的地方。</text>

  <!-- bottom two boxes -->
  <rect x="40" y="522" width="510" height="122" rx="10" fill="#1e1d26" stroke="#35333f" stroke-width="1.2"/>
  <text x="60" y="549" fill="#ececf1" font-size="14" font-weight="700">授权门　hooks.on_tool_call</text>
  <text x="60" y="576" fill="#86efac" font-size="12.5">MCP 路：看到 session_ctl + 真实 args</text>
  <text x="60" y="596" fill="#d6d4de" font-size="12.5">　　　　→ 仍能逐 op 判、按 agent 名判</text>
  <text x="60" y="620" fill="#fcd34d" font-size="12.5">script 路：只看到一条 bash 命令行</text>
  <text x="60" y="638" fill="#d6d4de" font-size="12.5">　　　　→ 参数藏在进程内部，判不了</text>

  <rect x="570" y="522" width="510" height="122" rx="10" fill="#1e1d26" stroke="#35333f" stroke-width="1.2"/>
  <text x="590" y="549" fill="#ececf1" font-size="14" font-weight="700">server 归属的唯一作用</text>
  <text x="590" y="576" fill="#86efac" font-size="12.5">留在 @kirocrew-dashboard：opt-in 可指派</text>
  <text x="590" y="600" fill="#fcd34d" font-size="12.5">放进 @kirocrew-core：每个 session 都常驻</text>
  <text x="590" y="620" fill="#d6d4de" font-size="12.5">　→ 从不用它的 session 白背这个 stub</text>
  <text x="590" y="638" fill="#9b98a8" font-size="11.5">（与身份无关，是另一个维度）</text>

  <text x="40" y="676" fill="#9b98a8" font-size="12">stub 面 6 → 1（先例：browser 工具，mcp_tools/browser.py:198）　·　身份与授权不变　·　幂等仍待 queue.py 收</text>
</svg>

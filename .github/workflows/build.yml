name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Build Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build frontend
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Stage frontend into package
        run: |
          rm -rf src/kiro_claw/static/dist
          mkdir -p src/kiro_claw/static
          cp -R website/dist src/kiro_claw/static/dist

      - name: Build wheel
        run: |
          pip install --upgrade build
          python -m build --wheel

      - name: Verify wheel installs cleanly
        run: |
          pip install dist/*.whl
          kiroclaw --version

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl

  # Desktop build disabled until PyInstaller hidden-import issue is fixed.
  # croniter (and possibly other deps) not bundled by PyInstaller's auto-detection.

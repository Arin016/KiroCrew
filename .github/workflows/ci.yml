name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[voice]" --group dev

      # black + isort checks disabled until bulk format pass is done.
      # The de-Amazonification sync lost formatting. Run:
      #   black --target-version py310 src/ test/ && isort src/ test/
      # then commit as a standalone formatting PR to enable these checks.

      - name: Lint (flake8)
        continue-on-error: true
        run: flake8 src/ test/

      - name: Type check (mypy)
        continue-on-error: true
        run: mypy src/kiro_claw/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[voice,desktop]" --group dev

      - name: Enable user namespaces (required for sandbox tests)
        run: sudo sysctl -w kernel.unprivileged_userns_clone=1

      - name: Run tests
        run: pytest -q -n auto --timeout=120 --cov=kiro_claw --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage.xml

  frontend-lint:
    name: Frontend Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Type check
        working-directory: website
        run: npm run typecheck

      - name: Lint
        continue-on-error: true
        working-directory: website
        run: npx eslint src/ --max-warnings 1200

      - name: Copy/paste detection
        working-directory: website
        run: npx jscpd .

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        working-directory: website
        run: npx vitest run --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: website/coverage/
